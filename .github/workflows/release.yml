name: Build and Release SqlQueryStress

on:
  push:
    tags:
      - 'v*' # Triggers ONLY when a tag starting with 'v' (e.g., v1.0.0) is pushed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run All Tests
        run: dotnet test --verbosity normal

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating the GitHub Release and committing to Casks/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Ruby (Required for fpm)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zip libarchive-tools zstd curl
          gem install fpm

      - name: Make scripts executable
        run: |
          chmod +x ./deploy_linux.sh
          chmod +x ./deploy_windows.sh
          chmod +x ./deploy_mac.sh

      - name: Extract Clean Version Number
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          echo "APP_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

      - name: Run Deployment Scripts with Tag Version
        run: |
          echo "Building SqlQueryStress version $APP_VERSION"
          ./deploy_linux.sh "$APP_VERSION"
          ./deploy_windows.sh "$APP_VERSION"
          ./deploy_mac.sh "$APP_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SqlQueryStress ${{ github.ref_name }}"
          files: |
            releases/linux/*
            releases/windows/*
            releases/macos/*
          generate_release_notes: true

      - name: Update Homebrew Cask Automatically
        env:
          REPO: ${{ github.repository }}
        run: |
          ARM64_SHA=$(sha256sum "releases/macos/SqlQueryStress-${APP_VERSION}-osx-arm64.zip" | awk '{print $1}')
          X64_SHA=$(sha256sum "releases/macos/SqlQueryStress-${APP_VERSION}-osx-x64.zip" | awk '{print $1}')

          # Switch from detached tag HEAD to the latest master branch before committing
          git fetch origin master
          git checkout master

          mkdir -p Casks
          cat <<EOF > Casks/sqlquerystress.rb
          cask "sqlquerystress" do
            version "${APP_VERSION}"

            on_arm do
              sha256 "${ARM64_SHA}"
              url "https://github.com/${REPO}/releases/download/v#{version}/SqlQueryStress-#{version}-osx-arm64.zip"
            end
            on_intel do
              sha256 "${X64_SHA}"
              url "https://github.com/${REPO}/releases/download/v#{version}/SqlQueryStress-#{version}-osx-x64.zip"
            end

            name "SqlQueryStress"
            desc "Cross-platform SQL Server load testing utility"
            homepage "https://github.com/${REPO}"

            app "SqlQueryStress.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/SqlQueryStress.app"],
                             sudo: false
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sqlquerystress.rb
          git commit -m "chore(brew): update cask to v${APP_VERSION} [skip ci]" || true
          git push origin master